name: nix build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build cabal-audit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26

      - name: Set up cachix
        uses: cachix/cachix-action@v14
        with:
          name: cabal-audit
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: |
          nix -Lv flake check

  nightly:
    name: Publish nightly (ubuntu, dynamic)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install zlib dev headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Install GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'

      - name: Build cabal-audit
        run: |
          cabal update
          cabal build exe:cabal-audit
          cabal install exe:cabal-audit --install-method=copy --installdir dist-nightly

      - name: Upload artifact (verification for non-main runs)
        uses: actions/upload-artifact@v4
        with:
          name: cabal-audit
          path: dist-nightly/cabal-audit

      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload nightly --clobber --repo "$GITHUB_REPOSITORY" \
            dist-nightly/cabal-audit#cabal-audit
